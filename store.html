<!DOCTYPE html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;padding:16px;max-width:520px;margin:auto;background:#fafaf9;color:#111;padding-bottom:80px}
#store{background:#000;color:#fff;border:2.5px solid #000;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:5px 5px 0 #000}
#store h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-0.6px}
#store p{margin:8px 0 0;font-size:13px;font-weight:600;opacity:0.9;line-height:1.4}
#store button{width:100%;padding:13px;margin-top:12px;border:2.5px solid #fff;border-radius:14px;font-weight:900;font-size:14px;background:#fff;color:#000;cursor:pointer;box-shadow:3px 3px 0 #fff;transition:0.15s}
#store button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 #fff}
#store hr{border:1px solid #333;margin-top:14px}
.card{border:2.5px solid #000;border-radius:16px;padding:14px;margin:10px 0;background:#fff;box-shadow:4px 4px 0 #000;cursor:pointer;transition:0.15s;font-weight:800;font-size:14px}
.card:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 #000}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
a{color:#000;font-weight:900;text-decoration:none;border-bottom:2px solid #000}
p:last-child{margin-top:18px;text-align:center}
</style></head><body>
<div id="store">Loading store...</div><div id="products">Loading products...</div><p><a href="index.html">← Home</a></p>
<script type="module">
import {supabase} from './supabaseClient.js'
let id=new URLSearchParams(location.search).get('id')
let {data:profile}=await supabase.from('profiles').select('*').eq('id',id).single()
document.getElementById('store').innerHTML=`<h2>🏪 ${profile.store_name}</h2><p>📞 ${profile.phone} | ${profile.email} | Role: ${profile.role}</p><button onclick="location.href='messages.html?to=${profile.id}'">💬 Chat Seller</button><hr>`
let {data:prods}=await supabase.from('products').select('*').eq('seller_id',id)
document.getElementById('products').innerHTML=prods?.map(p=>`<div class="card" onclick="location.href='product.html?id=${p.id}'"><b>${p.title}</b> - ₦${p.price.toLocaleString()}</div>`).join('')||'<div style="border:2.5px dashed #000;border-radius:16px;padding:20px;text-align:center;background:#fff">No products in this store yet</div>'
</script></body></html>
