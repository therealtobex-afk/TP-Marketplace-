<!DOCTYPE html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;padding:16px}#chat{border:2px solid #000;border-radius:12px;height:60vh;overflow-y:auto;padding:10px}.msg{margin:6px 0;padding:8px;border-radius:10px;max-width:80%}.me{background:#000;color:#fff;margin-left:auto}.other{background:#f0f0f0}</style></head><body>
<h3>💬 Messages</h3><div id="chat"></div><input id="text" placeholder="Type message" style="width:70%;padding:12px;border:2px solid #000;border-radius:10px"><button onclick="send()" style="width:25%;padding:12px;background:#000;color:#fff;border-radius:10px">Send</button>
<script type="module">
import {supabase} from './supabaseClient.js'
let to=new URLSearchParams(location.search).get('to')
let {data:{user}}=await supabase.auth.getUser()
async function load(){let {data}=await supabase.from('messages').select('*').or(`and(sender_id.eq.${user.id},receiver_id.eq.${to}),and(sender_id.eq.${to},receiver_id.eq.${user.id})`).order('created_at');document.getElementById('chat').innerHTML=data?.map(m=>`<div class="msg ${m.sender_id==user.id?'me':'other'}">${m.message}</div>`).join('')}
window.send=async()=>{await supabase.from('messages').insert({sender_id:user.id,receiver_id:to,message:text.value});text.value='';load()}
load(); setInterval(load,3000)
</script></body></html>
